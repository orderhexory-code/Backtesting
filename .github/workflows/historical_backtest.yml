name: 1-Click NASDAQ Real Data Backtest & Live Report

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Real Market Symbol"
        required: true
        type: choice
        options:
          - "NQ=F"
          - "QQQ"
          - "MNQ=F"
        default: "NQ=F"
      days_to_fetch:
        description: "Days of Real 1-Minute Data"
        required: true
        default: "28"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Real 1M Data
        run: |
          mkdir -p data/processed dashboard results
          python -c "
          from src.data_fetcher import FreeDataFetcher
          FreeDataFetcher.fetch_real_30d_1m(
              symbol='${{ github.event.inputs.symbol }}',
              days=int('${{ github.event.inputs.days_to_fetch }}'),
              output_path='data/processed/MNQ_1m.parquet'
          )
          "

      - name: Validate Data
        run: |
          python main.py validate-data --data data/processed/MNQ_1m.parquet --report-out results/data_quality.json

      - name: Run Engine & Export dashboard/data.json
        run: |
          python main.py backtest --data data/processed/MNQ_1m.parquet --config config/strategy.yaml --output-dir results/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-data-${{ github.run_id }}
          path: results/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact (From dashboard/ folder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dashboard/"

  deploy-pages:
    needs: run-backtest
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
