name: Historical Backtest

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Instrument Symbol"
        required: true
        default: "MNQ"
      start_date:
        description: "Start Date (YYYY-MM-DD)"
        required: false
        default: "2024-01-01"
      end_date:
        description: "End Date (YYYY-MM-DD)"
        required: false
        default: "2026-01-01"
      config_file:
        description: "Config File"
        required: true
        default: "config/strategy.yaml"
      scenario:
        description: "Synthetic Scenario (if no live data uploaded)"
        required: true
        default: "upside_breakout"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate or Acquire Historical Data
        run: |
          python main.py generate-synthetic \
            --output data/processed/MNQ_1m.parquet \
            --scenario "${{ github.event.inputs.scenario }}" \
            --hours 48

      - name: Validate Data
        run: |
          python main.py validate-data \
            --data data/processed/MNQ_1m.parquet \
            --report-out results/data_quality.json

      - name: Run Historical Backtest
        run: |
          python main.py backtest \
            --data data/processed/MNQ_1m.parquet \
            --config "${{ github.event.inputs.config_file }}" \
            --output-dir results/

      - name: Upload Backtest Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.event.inputs.symbol }}-${{ github.run_id }}
          path: results/
          if-no-files-found: error